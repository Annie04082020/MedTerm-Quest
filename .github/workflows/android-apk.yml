name: Build & Release APK
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'android/**'
      - 'backend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '*config*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      signing:
        description: Auto uses the stable key when configured; preview uses a temporary debug key
        type: choice
        options: [auto, stable, preview]
        default: auto
      version:
        description: Optional release tag, e.g. v0.7.0; blank uses v0.6.<build number>
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  MEDTERM_MOBILE_BANK: ''
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r backend/requirements-local-ai.txt pytest
      - run: python -m pytest backend tests/test_release_plan.py -q
      - run: npm run test:core
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node --experimental-strip-types scripts/mobile-test-fixtures.mjs
      - run: npm run build:android
      - run: npm run test:mobile
      - name: Browser failure diagnostics (public demo fixtures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures-${{ github.run_number }}
          path: test-results/
          retention-days: 7
  apk:
    needs: validate
    outputs:
      stable: ${{ steps.signing.outputs.stable }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MEDTERM_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve Android and release version
        id: version
        env:
          MEDTERM_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_plan.py
      - name: Set APK version name
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: echo "MEDTERM_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - run: node --experimental-strip-types scripts/mobile-test-fixtures.mjs --android-assets
      - name: Native SQLite transaction and persistence tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android offline games and local document tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          disable-animations: true
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Check the APK has no materials or question bank
        run: python scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare stable signing when available
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING: ${{ inputs.signing || 'auto' }}
        run: |
          if [ "$SIGNING" = preview ]; then
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          elif [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/medterm.p12"
            chmod 600 "$RUNNER_TEMP/medterm.p12"
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          elif [ "$SIGNING" = stable ] || [ -n "$KEYSTORE$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo 'All four Android signing secrets are required together.'; exit 1
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No stable signing key is configured; building a preview APK.'
          fi
      - name: Build stable signed APK
        if: steps.signing.outputs.stable == 'true'
        working-directory: android
        env:
          MEDTERM_KEYSTORE_PATH: ${{ runner.temp }}/medterm.p12
          MEDTERM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDTERM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDTERM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          python ../scripts/check-apk.py app/build/outputs/apk/release/app-release.apk
      - name: Prepare APK artifact
        env:
          STABLE: ${{ steps.signing.outputs.stable }}
        run: |
          mkdir -p apk-output
          if [ "$STABLE" = true ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/medterm-quest-stable.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/medterm-quest-preview.apk
          fi
          (cd apk-output && sha256sum *.apk > SHA256SUMS.txt)
          printf 'No course materials, history, Gist token or passphrase are bundled. Import your local JSON bank or unlock optional encrypted Gist sync.\nPreview APKs use an ephemeral key; export progress before replacing with a differently signed app. Stable APKs retain the same signing identity for in-place updates.\n' > apk-output/READ-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: medterm-quest-android-${{ github.run_number }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
          retention-days: 7
  release:
    name: Publish signed APK to GitHub Releases
    needs: apk
    if: needs.apk.outputs.stable == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: medterm-quest-android-${{ github.run_number }}
          path: apk-output
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.apk.outputs.tag }}
          PRERELEASE: ${{ needs.apk.outputs.prerelease }}
        run: |
          set -euo pipefail
          test -f apk-output/medterm-quest-stable.apk
          (cd apk-output && sha256sum --check SHA256SUMS.txt)
          python scripts/check-apk.py apk-output/medterm-quest-stable.apk
          target=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$target" || { echo 'Existing tag points to different code; choose a new version.'; exit 1; }
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .target_commitish)" = "$target" || { echo 'Existing release targets different code; choose a new version.'; exit 1; }
            if [ "$(cat is-draft.txt)" = false ]; then
              gh release view "$TAG" --json assets --jq '.assets[].name' > existing-assets.txt
              for file in medterm-quest-stable.apk SHA256SUMS.txt READ-ME.txt; do
                grep -Fxq "$file" existing-assets.txt || { echo 'Existing published release is incomplete; it was not overwritten.'; exit 1; }
              done
              echo 'Release already published for this commit; leaving its assets unchanged.'
              exit 0
            fi
          else
            printf 'Android APK built and tested from commit %s.\n\nImport your local question bank or unlock optional encrypted Gist sync. No course materials or credentials are bundled.\n\nThis APK uses the persistent signing identity. Export progress before replacing an old preview installation.\n' "$target" > release-notes.md
            gh release create "$TAG" --target "$target" --title "MedTerm Quest $TAG" --draft --generate-notes --notes-file release-notes.md
          fi
          gh release upload "$TAG" apk-output/medterm-quest-stable.apk apk-output/SHA256SUMS.txt apk-output/READ-ME.txt --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          printf '### APK release\n\n[Download %s](https://github.com/%s/releases/tag/%s)\n' "$TAG" "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
